# docker-compose.yml
# Infrastructure only — postgres with pgvector.
# The backend runs locally: uvicorn app.main:app --reload
# Usage: docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: terapanth
      POSTGRES_USER: terapanth
      POSTGRES_PASSWORD: terapanth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terapanth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
