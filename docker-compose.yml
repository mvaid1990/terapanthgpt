services:
  postgres:
    image: postgres:16
    container_name: rrs_postgres
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.80.3
    container_name: rrs_n8n
    depends_on:
      - postgres
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.24.10
    container_name: rrs_weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T05-07-00Z
    container_name: rrs_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.1.48
    container_name: rrs_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ingestion_api:
    build:
      context: ./ingestion
    container_name: rrs_ingestion_api
    depends_on:
      - weaviate
      - ollama
    environment:
      WEAVIATE_URL: http://weaviate:8080
      STORAGE_BACKEND: local
      ARTIFACTS_DIR: /data/artifacts
      OLLAMA_BASE_URL: http://ollama:11434
      EMBED_MODEL: nomic-embed-text
      CHAT_MODEL: llama3.1:8b
      INGESTION_API_KEY: devkey
      SQLITE_PATH: /data/app.db
      OCR_ENABLED: "true"
      OCR_MAX_PAGES: "5"
      WHISPER_MODEL_SIZE: "small"
    ports:
      - "8000:8000"
    volumes:
      - ingestion_data:/data
    restart: unless-stopped

  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rrs_open_webui
    depends_on:
      - ingestion_api
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://ingestion_api:8000/v1
      OPENAI_API_KEY: devkey
      WEBUI_AUTH: "False"
    volumes:
      - openwebui_data:/app/backend/data
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  weaviate_data:
  minio_data:
  ollama_data:
  ingestion_data:
  openwebui_data:
